timesteps: [0,250]

name: "${exp_setting}_SIMON_${brain_backbone}_${vision_backbone}"

models:
  brain:
    target: "base.eeg_backbone.${brain_backbone}"
    params:
        c_num: 17
        z_dim: ${z_dim}
        timesteps: ${timesteps}

data:
  data_dir: SIMON/data/things-eeg/Preprocessed_data_250Hz_whiten
  feature_dir : SIMON/Image_feature
  selected_ch: "OP"
  model_type: ${vision_backbone}
  train_batch_size: 1024
  val_batch_size: 200
  test_batch_size: 200
  train_avg: True
  test_avg: True
  timesteps: ${timesteps}

train:
  epoch: ${epoch}
  optimizer: AdamW
  lr: ${lr}
  
save_dir: 'exp'

